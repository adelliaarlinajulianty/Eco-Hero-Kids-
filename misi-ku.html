    <section class="misi-container">
        <header class="misi-header">
            <h1>Pilih Misi Kamu!</h1>
            <p>Selesaikan semua misi dan jadi EcoHero sejati!</p>
            
            <div class="progress-section">
                <span>PROGRES PETUALANGAN</span>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
                <span class="progress-text">0/3 Misi Selesai</span>
            </div>
        </header>
        <div class="card-wrapper">
    <div class="card card-1">
        <div class="badge yellow">MISI 1</div>
        <h3>RUMAH<br>HEMAT ENERGI</h3>
        <div class="image-box">
            <img src="rumah misi ku.png" alt="Misi 1">
        </div>
        <a href="misi1.html">
            <button class="btn-mulai">MULAI</button>
        </a>
    </div> <div class="card card-2">

        <a href="misi2.html">

    </div> <div class="card card-3">
        <div class="badge purple">MISI 3</div>

        </div>
        <a href="misi3.html">
            <button class="btn-mulai">MULAI</button>
        </a>
    </div> 
    </section>
<script>
        let misiSelesai = 0;
        const totalMisi = 3;

        function tambahProgres() {
            if (misiSelesai < totalMisi) {
                misiSelesai++;
                let persen = (misiSelesai / totalMisi) * 100;
                
                // Mengubah lebar bar
                document.getElementById("progress-fill").style.width = persen + "%";
                
                // Mengubah teks angka
                document.getElementById("progress-text").innerText = misiSelesai + "/3 Misi Selesai";
            }
        }
    </script>
